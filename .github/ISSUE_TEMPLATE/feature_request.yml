name: Feature request
description: A new capability, agent or trace format
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that tracequest makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. For a new agent, include where it stores sessions and a scrubbed sample.
