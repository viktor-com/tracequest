name: CI

# The gate: tests that catch a real break of a user path (hub loads, session
# list, session page, live session, search). Release runs this same workflow.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache sidecar build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar

      - name: Build sidecar release binary
        run: npm run build:sidecar

      - name: Run tests
        run: npm test

      - name: Validate CLI
        run: |
          node bin/tracequest.js --version
          node bin/tracequest.js --help

  # The README quickstart on a clean runner with no Rust toolchain: npm install,
  # npm run demo, and the UI serves the bundled samples.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hide cargo so the JS-indexer fallback is exercised
        run: |
          for d in $(dirname "$(command -v cargo 2>/dev/null || echo /nonexistent/cargo)"); do
            echo "PATH=$(echo "$PATH" | tr ':' '\n' | grep -vx "$d" | paste -sd: -)" >> "$GITHUB_ENV"
          done

      - name: npm install
        run: npm install

      - name: npm run demo serves the sample sessions on 127.0.0.1
        run: |
          npm run demo > demo.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7777/api/sessions > sessions.json && break
            sleep 1
          done
          cat demo.log
          node -e 'const s=require("./sessions.json").sessions; if (s.length !== 2) throw new Error("expected 2 sample sessions, got " + s.length); console.log(s.map(x => x.project).join(", "))'
          curl -sf http://127.0.0.1:7777/ | grep -qi "tracequest"
