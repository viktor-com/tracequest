name: Release

on:
  push:
    tags: [ "v*" ]

jobs:
  # One tarball per platform, each built and smoke-tested on the hardware it
  # targets. Cross-compiled binaries would ship untested on the CPU that runs
  # them, which is exactly how a silent JS fallback got shipped before.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14      # Apple silicon
            platform: darwin-arm64
          - runner: ubuntu-24.04  # Linux x86_64 (glibc)
            platform: linux-x64
            # Hosted Ubuntu runners are slower/noisier than macos-14; the
            # micro-benchmark budgets miss by 15-40% there (0.7.2 run). Skip
            # the timing asserts on this leg only; the workloads still run and
            # the macOS leg keeps enforcing the budgets.
            skip_perf: "1"
          # darwin-x64 is temporarily disabled: GitHub no longer allocates
          # macos-13 (Intel) hosted runners for this repo — the job sat queued
          # with no runner for hours and auto-cancelled on 0.2.0 and 0.3.0.
          # Re-enable with a native Intel runner, or add a cross-build on the
          # Apple-silicon runner that smoke-tests the x64 binary under Rosetta.
          # - runner: macos-13    # Intel
          #   platform: darwin-x64

    runs-on: ${{ matrix.runner }}
    env:
      # Perf budgets are skipped on the linux leg only (matrix.skip_perf); this
      # covers `facts check` (which runs perf-backed facts) and `npm test` alike.
      TRACEQUEST_SKIP_PERF_ASSERTS: ${{ matrix.skip_perf || '0' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify runner matches target platform
        run: |
          host="$(node -p 'process.platform + "-" + process.arch')"
          if [ "$host" != "${{ matrix.platform }}" ]; then
            echo "runner is $host but matrix targets ${{ matrix.platform }}" >&2
            exit 1
          fi

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run facts check (--tags spec)
        run: npx --yes @avcodes/facts check --tags "spec"

      - name: Run tests
        run: npm test

      # prepack stages the sidecar for this platform and the preflight refuses
      # to continue unless the staged binary's real CPU arch matches.
      - name: Build tarball
        run: npm run dist -- ${{ matrix.platform }}

      - name: Smoke-test the tarball on this hardware
        run: |
          version="$(node -p "require('./package.json').version")"
          tarball="$PWD/dist/tracequest-$version-${{ matrix.platform }}.tgz"
          prefix="$RUNNER_TEMP/install"
          home="$RUNNER_TEMP/home"
          mkdir -p "$prefix" "$home/.claude/projects/demo"
          printf '{"type":"user","message":{"content":[{"type":"text","text":"smoke"}]}}\n' \
            > "$home/.claude/projects/demo/s.jsonl"

          npm install -g --prefix "$prefix" "$tarball"
          "$prefix/bin/tracequest" --version
          "$prefix/bin/tracequest" --help > /dev/null

          # The sidecar must actually execute, not fall back to the JS indexer.
          out="$(HOME="$home" "$prefix/bin/tracequest" search smoke 2>&1 >/dev/null || true)"
          echo "$out"
          if ! echo "$out" | grep -q "via sidecar"; then
            echo "sidecar did not run on ${{ matrix.platform }}" >&2
            exit 1
          fi
          if echo "$out" | grep -qi "bundles the sidecar for"; then
            echo "platform mismatch warning on its own platform" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify every supported platform is present
        run: |
          version="${GITHUB_REF_NAME#v}"
          missing=0
          platforms="$(node --input-type=module -e \
            "import('./scripts/dist-platforms.mjs').then(m=>console.log(m.SUPPORTED_PLATFORMS.join(' ')))")"
          for platform in $platforms; do
            if [ ! -f "dist/tracequest-$version-$platform.tgz" ]; then
              echo "missing dist/tracequest-$version-$platform.tgz" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -l dist/

      # Hosting is the GitHub Release itself, via the workflow's built-in token.
      # No external bucket, no repository secrets to configure.
      - name: Publish tarballs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes
